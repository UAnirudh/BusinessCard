<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f2" />
    <title>You're offline · Tappd</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0b0b0d; background: #f7f6f2; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e6e3da; border-radius: 24px; background: #fff; text-align: center; }
      .mark { display: inline-grid; width: 48px; height: 48px; place-items: center; border-radius: 15px; background: #d8ff37; }
      .mark svg { width: 27px; height: 27px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; letter-spacing: -.04em; }
      p { margin: 0; color: #6f6f69; line-height: 1.6; }
      button { min-height: 48px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 999px; background: #0b0b0d; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><rect x="2" y="2" width="36" height="36" rx="11" fill="#0B0B0D"/><path d="M14 26V14l13 12V14" stroke="#D8FF37" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1>You're offline</h1>
      <p>Your wallet stays private on this device. Reconnect to open your card, share it, or catch up on people you met.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
