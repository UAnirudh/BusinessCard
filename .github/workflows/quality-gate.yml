name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web audit, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Audit web dependencies
        run: npm audit --audit-level=low

      - name: Typecheck web app
        run: npm run typecheck

      - name: Test password reset and session revocation
        run: npm run test:auth

      - name: Test Wallet readiness
        run: npm run test:wallet

      - name: Test mobile card reference validation
        run: npx tsx --test tests/mobile-card-reference.test.ts

      - name: Test native card profile validation
        run: npx tsx --test tests/mobile-card-profile.test.ts

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://tappd.example.invalid

  android-bundle:
    name: Mobile checks and Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint

      - name: Check Expo configuration and dependencies
        working-directory: mobile
        run: npx expo-doctor

      - name: Export Android bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

      - name: Export iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-export"
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compile Android QA release APK (debug-signed, not for Play)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://tappd.up.railway.app

      - name: Upload Android QA APK (debug-signed, not for Play)
        uses: actions/upload-artifact@v4
        with:
          name: tappd-android-qa-debug-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate iOS native project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install iOS native dependencies
        working-directory: mobile/ios
        run: pod install

      - name: Compile iOS simulator app
        working-directory: mobile/ios
        run: xcodebuild -workspace Tappd.xcworkspace -scheme Tappd -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
